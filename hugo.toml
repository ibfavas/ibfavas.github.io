  [[params.projects]]
    title = "Threat Intelligence Pipeline & Wazuh Detection Engineering"
    subtitle = "Blue Team CTI Automation"
    body = "Architected a Python CTI pipeline ingesting 55,000+ IOCs per run from URLhaus, Feodo Tracker, and AlienVault OTX. Built a weighted confidence-scoring engine ranking 45,000+ indicators by recency, source trust, and corroboration - exporting 1,800+ IPs and 1,600+ domains into Wazuh CDB lists with automatic SIEM hot-reload. Enriched high-confidence IOCs via AbuseIPDB and VirusTotal; authored custom Wazuh rules mapped to MITRE ATT&CK T1071. Automated on a 6-hour systemd timer cycle."
    link = "https://github.com/ibfavas/threat-intel-pipeline"
    cta = "Open repository"

  [[params.projects]]
    title = "Linux Infrastructure Hardening & SIEM Orchestration"
    subtitle = "CIS Compliance & Detection Stack"
    body = "Audited Arch Linux against CIS Benchmark v3.0, remediating 100+ misconfigurations to lift SCA compliance from 26% to 83%. Deployed 22,000+ auditd rules (Neo23x0 baseline) for kernel-level telemetry and MITRE ATT&CK-mapped detection. Hardened via kernel module blacklisting, noexec/nosuid/nodev mounts, and sysctl protections. Containerized Wazuh for real-time FIM, SCA scoring, and SOC-style triage."
    link = "https://github.com/ibfavas/Arch-Hardening-Project"
    cta = "Open repository"

  [[params.projects]]
    title = "Peelr"
    subtitle = "Lightweight JavaScript Security Scanner"
    body = "Engineered a lightweight, concurrent CLI security utility in Go (stdlib-only) for automated client-side reconnaissance. Implements high-performance regex pattern matching to extract API keys, hardcoded secrets, hidden endpoints, and sensitive exposure strings from local and remote JavaScript source files. Surfaces risk scores via CLI and local web UI with scan history and diff support."
    link = "https://github.com/ibfavas/peelr"
    cta = "Open repository"

  [[params.projects]]
    title = "NetPulse"
    subtitle = "Real-Time Network Telemetry HUD"
    body = "Developed a lightweight, real-time network diagnostic tool for Linux in Go using goroutines for zero-dependency terminal-based telemetry. Concurrently monitors gateway latency, interface throughput (RX/TX speeds), and backbone packet loss metrics. Engineered raw ICMP socket capabilities with unprivileged fallback and a circular buffer interface for real-time network alerts and background daemon mode."
    link = "https://github.com/ibfavas/netpulse"
    cta = "Open repository"

